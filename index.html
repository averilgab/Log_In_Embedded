<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main>
    <div class="container">
      <h2>Log in to your account</h2>
      <form>
        <!-- Email Input -->
        <div class="email-password-div">
          <input type="email" placeholder="Email" id="email" required>
        </div>

        <!-- Password Input -->
        <div class="email-password-div">
          <input type="password" placeholder="Password" id="password" required>
          <div class="strong-div">
            <button type="button" onclick="show()" id="show">SHOW</button>
            <button type="button" onclick="hide()" id="hide">HIDE</button>
          </div>
        </div>

        <!-- Warning Message -->
        <h3 id="warning"></h3>

        <!-- Login Button -->
        <div class="login">
          <button type="submit" onclick="login()">Log In</button>
        </div>

        <!-- Forgot Password -->
        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>
      </form>

      <!-- Social Login Options -->
      <div class="links-div">
        <div class="links">
          <img src="https://cdn.pixabay.com/photo/2015/12/11/11/43/google-1088004_1280.png" alt="Google logo">
          <p>Continue with Google</p>
        </div>
        <div class="links">
          <img src="https://cdn.pixabay.com/photo/2022/01/30/13/33/github-6980894_1280.png" alt="GitHub logo" class="github">
          <p>Continue with GitHub</p>
        </div>
        <div class="links">
          <img src="https://cdn.pixabay.com/photo/2017/01/28/13/23/color-circle-articles-2015356_1280.png" alt="Firefox logo">
          <p>Continue with Firefox</p>
        </div>
        <div class="links">
          <img src="https://cdn.pixabay.com/photo/2016/01/26/17/15/gmail-1162901_1280.png" alt="Gmail logo">
          <p>Continue with Gmail</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
